name: promote
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
# Each job is granted only what it uses: version opens the changelog roll-up PR, promote the
# promotion PR. Both open them as the GitHub App in RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY
# when those are set, so their checks run without an "Approve and run" click.
permissions: {}
# Only push-triggered and manual runs share the group. A develop merge also re-runs CI on the
# open promotion PR; that run's promote job is skipped by `if`, but concurrency applies before
# `if`, so in a shared group it would cancel the push run that does the work (#17).
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
        && 'promote-develop-to-main' || format('promote-skip-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  # Rolls [Unreleased] into the next version on chore/roll-changelog and opens or updates the
  # roll-up PR into develop. Merging it is the decision to release: the run that merge starts
  # has nothing left to roll, and promote opens the promotion PR with the rolled changelog.
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: write
      pull-requests: write
    uses: ggrace519/.github/.github/workflows/version.yml@8217a8363cd8f8222471a39df2a0892e0fec2c00 # v2.0.0
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  promote:
    needs: version
    # Not while a roll-up PR is open, nor for a commit develop has moved past.
    if: needs.version.outputs.promote == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ggrace519/.github/.github/workflows/promote.yml@8217a8363cd8f8222471a39df2a0892e0fec2c00 # v2.0.0
    with:
      ref: ${{ needs.version.outputs.sha }}
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      merge-note: "Merging to main tags vX.Y.Z from the top CHANGELOG.md version and publishes the image to GHCR."
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
