# Release on every push to main: tag vX.Y.Z and publish the GitHub release from the top
# `## [X.Y.Z] - YYYY-MM-DD` section of CHANGELOG.md (shared ggrace519/.github workflow), then
# build, smoke-test and push ghcr.io/ggrace519/nut-upsd:<version> (and :latest) for linux/amd64
# and linux/arm64.
# On the promotion pull request the release job is a dry run, so a promotion whose
# [Unreleased] entries are not rolled into a new version fails before it can merge.
#
# The image job is chained with `needs:` rather than `on: push: tags`, because a tag made with
# GITHUB_TOKEN starts no other workflow. If the image push fails after the tag exists, use
# "Re-run failed jobs": the release job's outputs are kept, so the image job runs again.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ggrace519/nut-upsd

jobs:
  release:
    permissions:
      contents: write
    uses: ggrace519/.github/.github/workflows/release.yml@0e67344dbe377d259b4973d7546a08da0864c620 # v1.2.0
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}

  image:
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Build and smoke test
        run: |
          docker build --pull --build-arg VERSION="$VERSION" -t nut-upsd:release .
          tests/smoke.sh nut-upsd:release

      # arm64 is built under emulation here; CI has already built and smoke-tested it on a
      # native arm64 runner (ci.yml), on the same sources.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The run is a branch push, not a tag push, so the semver tag takes its value explicitly.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest
          flavor: |
            latest=false

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "$TAGS"
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
