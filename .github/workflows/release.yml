# Publish ghcr.io/ggrace519/nut-upsd:<version> (and :latest) for a vX.Y.Z tag on main.
# The image is built and smoke-tested again here before anything is pushed.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/ggrace519/nut-upsd

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      # "On main" alone passes for an old main commit: v1.1.0 was tagged on main before the
      # promotion merged and published 1.0.0's code. The tagged commit must carry its own
      # release notes, which only a promoted release PR adds.
      - name: Require a CHANGELOG entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version//./\\.}\] - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md at $GITHUB_SHA has no '## [$version] - <date>' heading. Merge the release PR and the promotion PR, then tag main."; exit 1; }

      - name: Build and smoke test
        run: |
          docker build --pull --build-arg VERSION="${GITHUB_REF_NAME#v}" -t nut-upsd:release .
          tests/smoke.sh nut-upsd:release

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
