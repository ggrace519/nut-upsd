version: 2
updates:
  # The Alpine base image (digest-pinned in the Dockerfile). Alpine point releases carry the
  # apk security fixes, so this is how NUT and its libraries get updated.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      # The shared ggrace519/.github workflows are our own releases: take them
      # as soon as they are out instead of after the default 3-day cooldown.
      exclude:
        - ggrace519/.github/.github/workflows/promote.yml
        - ggrace519/.github/.github/workflows/release.yml
        - ggrace519/.github/.github/workflows/version.yml
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
